<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tas's Exercise 2: GitHub Profile</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/ex2.js" defer></script>
</head>
<body>
    <h1>Information about a GitHub user</h1>
    <form id="lookup-form">
        <label for="login">GitHub login:</label>
        <input type="text" id="login" name="login" required>
        <button type="submit" id="lookup-button">Lookup</button>
    </form>
    <p id="status" role="status"></p>
    <p id="profile-picture"></p>
    <table id="profile" hidden>
        <tbody>
            <tr><th scope="row">Name</th><td id="profile-name"></td></tr>
            <tr><th scope="row">Blog</th><td id="profile-blog"></td></tr>
            <tr><th scope="row">Created</th><td id="profile-created"></td></tr>
        </tbody>
    </table>
    <p class="back-link"><a href="../index.html">Back to Homework 8</a></p>
</body>
</html>
